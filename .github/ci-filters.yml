# dorny/paths-filter filters for .github/workflows/ci.yml: each one decides
# whether the job of the same name runs. Edit freely; the workflow is frozen.
shared: &shared
  - .github/**
  - Makefile
  - scripts/ci/**

# Lint (all Swift) and TransitKit's tests on Linux.
swift:
  - *shared
  - App/**
  - Packages/**
  - .swiftformat
  - .swiftlint.yml

server:
  - *shared
  - server/**

# Build and test the app on a macOS runner.
ios:
  - *shared
  - project.yml
  - App/**
  - Packages/**
