# dorny/paths-filter filters for .github/workflows/ci.yml: each one decides
# whether the job of the same name runs. Edit freely; the workflow is frozen.
shared: &shared
  - .github/**
  - Makefile
  - scripts/ci/**
  - scripts/skip-unless.sh

# The pnpm workspace's root files, which every workspace's install depends on.
workspace: &workspace
  - package.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - turbo.json

# Lint (all Swift) and TransitKit's tests on Linux.
swift:
  - *shared
  - apps/ios/**
  - packages/transitkit/**
  - packages/glassui/**
  - .swiftformat
  - .swiftlint.yml

# The API (MOTIS image and smoke test) and the pnpm workspace's TypeScript checks.
server:
  - *shared
  - *workspace
  - apps/api/**
  - packages/tsconfig/**
  - packages/eslint-config/**

# Build and test the app on a macOS runner.
ios:
  - *shared
  - apps/ios/**
  - packages/transitkit/**
  - packages/glassui/**
