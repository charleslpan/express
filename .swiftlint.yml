# SwiftLint rules. SwiftFormat owns formatting; SwiftLint catches the rest.
excluded:
  - .build
  - packages/transitkit/.build
  - packages/glassui/.build
  - DerivedData
  - build
  - apps/ios/Express.xcodeproj
  - node_modules
  - "**/node_modules"

disabled_rules:
  - trailing_comma # SwiftFormat adds trailing commas
  - opening_brace # SwiftFormat decides brace placement
  - sorted_imports # SwiftFormat sorts imports (testable imports last)

opt_in_rules:
  - empty_count
  - first_where
  - toggle_bool

# Only `swiftlint analyze` runs these; it needs a full build log, so CI doesn't run it yet.
analyzer_rules:
  - unused_declaration
  - unused_import

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

identifier_name:
  excluded:
    - id
    - x
    - y
    - to # PlanRequest.to, after MOTIS's fromPlace/toPlace
    - xs # GlassUI's Spacing and Radius scales
    - sm
    - md
    - lg
    - xl
